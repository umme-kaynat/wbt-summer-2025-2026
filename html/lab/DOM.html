<!DOCTYPE html>
<html>
 
<head>
<title>Form Validation</title>
<script>
document.addEventListener("DOMContentLoaded", function () {
document.getElementById("myForm").addEventListener("submit", function (event) {
var fname = document.getElementById("fname").value;
var lname = document.getElementById("lname").value;
var email = document.getElementById("email").value;
var Number = document.getElementById("Number").value;
 
if (fname === "" || lname === "" || email === "" || Number === "") {
alert("All fields must be filled out.");
event.preventDefault();
return;
}
 
if (!email.includes("@")) {
alert("Please enter a valid email address (missing '@').");
event.preventDefault();
return;
}
 
var timestamp = Number.parse(Number);
if (isNaN(timestamp)) {
alert("Please enter a valid number.");
event.preventDefault();
return;
}
});
});
</script>
</head>
 
<body>
 
<form id="myForm" action=" " method="post">
First Name: <input type="text" id="fname" name="fname"><br><br>
Last Name: <input type="text" id="lname" name="lname"><br><br>
Email: <input type="text" id="email" name="email"><br><br>
Number: <input type="text" id="Number" name="Number"><br><br>
<input type="submit" value="Submit">
</form>
 
</body>
 
</html>
