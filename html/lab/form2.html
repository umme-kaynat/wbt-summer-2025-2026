<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
</head>

<body>

<div class="reg-form">
<h1>Registration</h1>
<p>Please complete all fields below.</p>
<hr>
</div>

<div class="reg-form">
    <label for="Full Name">Full Name:</label>
    <input type="text" id="Full Name" placeholder="Jane Doe">
</div>

<div class="reg-form">
    <label for="postal">Postal code:</label>
    <input type="number" id="postal" placeholder="10001">
</div>

<div class="reg-form">
    <label for="DOB">Date of Birth:</label>
    <input type="text" id="DOB" placeholder="25/06/2026">
</div>

<div class="reg-form">
    <label for="Email">Email Address:</label>
    <input type="email" id="Email" placeholder="jane@example.com">
</div>

<div class="reg-form">
    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="********">
</div>

<div class="reg-form">
    <label for="Country">Country:</label>
    <select id="country">
        <option>Select a country</option>
        <option>United States</option>
        <option>Canada</option>
        <option>Mexico</option>
    </select>
</div>
<div class="reg-buttons" >
    <button class ="btn-primary">Submit</button>
    <button class="btn-secondary">Reset</button>
</div>


</div>
</body>
</html>
